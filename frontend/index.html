<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mabilo Investments - Withdrawal System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <h1>Mabilo Investments - Withdrawal System</h1>

    <section id="portfolio-dashboard">
        <h2>Portfolio Dashboard</h2>

        <label for="investor-id">Investor ID:</label>
        <input type="number" id="investor-id" value="1" min="1">
        <button id="load-btn">Load Portfolio</button>

        <p id="portfolio-error" class="error"></p>

        <div id="portfolio-details"></div>

        <table id="products-table">
            <thead>
                <tr>
                    <th>Product</th>
                    <th>Type</th>
                    <th>Balance</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

    <section id="withdrawal-form-section">
        <h2>Submit a Withdrawal</h2>

        <form id="withdrawal-form">
            <label for="amount">Amount (ZAR):</label>
            <input type="number" id="amount" min="0.01" step="0.01" required>

            <label for="type">Type:</label>
            <select id="type" required>
                <option value="">-- Select type --</option>
                <option value="GENERAL">General</option>
                <option value="RETIREMENT">Retirement</option>
            </select>

            <button type="submit">Submit Withdrawal</button>
        </form>

        <p id="withdrawal-message"></p>
    </section>

    <section id="withdrawal-history">
        <h2>Withdrawal History</h2>

        <p id="history-message" class="error"></p>

        <table id="history-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Type</th>
                    <th>Amount</th>
                    <th>Status</th>
                    <th>Date Requested</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </section>

<section id="csv-download">
    <h2>Download Statement</h2>

    <label for="csv-type">Type:</label>
    <select id="csv-type">
        <option value="">All</option>
        <option value="GENERAL">General</option>
        <option value="RETIREMENT">Retirement</option>
    </select>

    <label for="csv-from">From:</label>
    <input type="date" id="csv-from">

    <label for="csv-to">To:</label>
    <input type="date" id="csv-to">

    <button id="csv-btn">Download CSV</button>

    <p id="csv-message"></p>
</section>

    <script src="js/script.js"></script>

</body>
</html>
